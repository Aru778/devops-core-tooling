
# GitHub Actions CI Pipeline
# Automatically validates Python code on push and pull requests.

name: Python CI Pipeline

# Define when the workflow should execute.
on:

  # Trigger when code is pushed to main.
  push:
    branches:
      - main

  # Trigger when a pull request targets main.
  pull_request:
    branches:
      - main

# Define the jobs to execute.
jobs:

  # Continuous Integration job.
  build:

    # GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    # Execute the following steps sequentially.
    steps:

      # Step 1: Download repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python 3.11.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

          # Cache pip dependencies.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Step 3: Install project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Run Python linting.
      - name: Run Flake8 Linter
        run: |
          python -m flake8 .

      # Step 5: Execute unit tests.
      - name: Run Pytest
        run: |
          python -m pytest -v
